[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrleval"
version = "0.1.0"
description = "Mini AI-control evaluation: trusted monitoring with an audit budget, extended to a cross-session (memory-reading) monitor."
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["anthropic"]

[project.scripts]
ctrleval = "ctrleval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
